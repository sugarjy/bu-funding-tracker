<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BU 科研资助追踪</title>
  <script>
    // 在样式加载前应用已保存的主题，避免刷新时闪一下
    try {
      const theme = localStorage.getItem('theme');
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <nav class="topbar">
    <span class="brand">bu/funding</span>
    <div class="topbar-right">
      <span class="topbar-meta" id="meta"></span>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </div>
  </nav>

  <main class="page">
    <header class="hero fade-in">
      <h1>BU 科研资助追踪</h1>
      <p class="lead">波士顿大学研究人员近期获得的 NIH 与 NSF 资助。数据来自公开的联邦资助数据库。</p>
    </header>

    <section class="section fade-in" aria-label="汇总">
      <div class="section-label"><span>overview</span><div class="rule"></div></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="section fade-in" aria-label="筛选">
      <div class="section-label"><span>filter</span><div class="rule"></div></div>
      <input type="search" id="search" class="search" placeholder="搜索教授、项目标题、资助机构…" />
      <div class="filter-row">
        <label><span>时间</span>
          <select id="range">
            <option value="30">最近 30 天</option>
            <option value="90" selected>最近 90 天</option>
            <option value="180">最近 180 天</option>
            <option value="365">最近一年</option>
          </select>
        </label>
        <label><span>来源</span>
          <select id="source">
            <option value="">全部</option>
            <option value="NIH">NIH</option>
            <option value="NSF">NSF</option>
          </select>
        </label>
        <label><span>院系</span>
          <select id="department"><option value="">全部</option></select>
        </label>
        <label><span>排序</span>
          <select id="sort">
            <option value="date">最新优先</option>
            <option value="amount">金额最高</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="new-only" checked />
          <span>只看新拿到的资助</span>
        </label>
      </div>
    </section>

    <div class="layout fade-in">
      <section class="section" aria-label="资助列表">
        <div class="section-label">
          <span>awards</span><div class="rule"></div>
          <span class="result-count" id="result-count"></span>
        </div>
        <p class="hint" id="hint" hidden>
          <span id="hint-text"></span>
          <button id="show-all">显示全部 →</button>
        </p>
        <div id="awards"></div>
        <button class="more" id="more" hidden>加载更多 ↓</button>
      </section>

      <aside class="section leaders" aria-label="资助金额最高的 PI">
        <div class="section-label"><span>top pis</span><div class="rule"></div></div>
        <ol id="leaders"></ol>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <span>
      数据来源 <a href="https://reporter.nih.gov/" target="_blank" rel="noopener">nih reporter</a> /
      <a href="https://www.nsf.gov/awardsearch/" target="_blank" rel="noopener">nsf award search</a>
    </span>
    <span>更新数据：<code>python3 scripts/fetch_data.py</code></span>
  </footer>

  <script src="data/awards.js"></script>
  <!-- 不用 type="module"：Chrome 不允许 file:// 下加载模块脚本 -->
  <script src="src/main.js"></script>
</body>
</html>
